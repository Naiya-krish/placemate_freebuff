name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: placemate/backend
    env:
      DATABASE_URL: sqlite:///./ci.db
      JWT_SECRET: ci-only-jwt-secret-not-a-production-value
      LLM_PROVIDER: mock
      DEMO_MODE: "true"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: ./storage/ci-uploads
      CORS_ORIGINS: http://localhost:3000
      PER_USER_MONTHLY_BUDGET: "1.50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: placemate/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: placemate/frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1
      NEXT_PUBLIC_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: placemate/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: placemate
    env:
      DATABASE_URL: sqlite:///./e2e.db
      JWT_SECRET: ci-e2e-only-jwt-secret
      LLM_PROVIDER: mock
      DEMO_MODE: "true"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: ./backend/storage/e2e-uploads
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1
      NEXT_PUBLIC_DEMO_MODE: "true"
      PER_USER_MONTHLY_BUDGET: "1.50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: placemate/frontend/package-lock.json
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -r backend/requirements.txt
          (cd frontend && npm ci && npx playwright install --with-deps chromium)
      - name: Prepare database + seed
        working-directory: placemate/backend
        run: |
          PYTHONPATH=. ../.venv/bin/python -c "from app.db.base import Base; from app.db.session import engine; import app.models  # noqa; Base.metadata.create_all(engine)"
          PYTHONPATH=. ../.venv/bin/python ../scripts/seed_questions.py
          PYTHONPATH=. ../.venv/bin/python ../scripts/seed_demo_data.py
      - name: Start servers
        working-directory: placemate
        run: |
          (cd backend && PYTHONPATH=. ../.venv/bin/uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &)
          (cd frontend && npm run dev > /tmp/web.log 2>&1 &)
          npx --prefix frontend wait-on http://localhost:3000 http://localhost:8000/healthz --timeout 120000
      - name: Playwright
        working-directory: placemate/frontend
        run: npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: |
          tail -100 /tmp/api.log || true
          tail -100 /tmp/web.log || true
