[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
explicit_package_bases = true
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
plugins = []
exclude = "(^alembic/versions/|^tests/)"

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "fitz.*", "docx.*", "pytesseract.*", "reportlab.*", "arq.*", "pgvector.*", "jwt.*", "slowapi.*"]
ignore_missing_imports = true
